name: entrega-semana3

services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: entrega-semana3-db:1.0
    container_name: sem3-mysql
    hostname: sem3-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - red_interna
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
    image: entrega-semana3-wordpress:1.0
    container_name: sem3-wordpress
    hostname: sem3-wordpress
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WORDPRESS_PORT}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - wp_data:/var/www/html
      - ./wordpress/wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
    networks:
      - red_interna

volumes:
  db_data:
    name: entrega-semana3_db_data
  wp_data:
    name: entrega-semana3_wp_data

networks:
  red_interna:
    name: entrega-semana3_red_interna
    driver: bridge
